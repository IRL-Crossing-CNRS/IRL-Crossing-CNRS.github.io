<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>IRL CROSSING - Resources</title>
    <!--
      GitHub Pages serves this file for any path it doesn't recognize as a
      static asset. Since this is a client-side routed SPA, we encode the
      requested path into the query string and redirect to the real
      index.html, which decodes it back before the router mounts.
      (github.com/rafgraph/spa-github-pages)
    -->
    <script>
      var path = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace('/?redirect=' + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
